name: Daily Investment Assistant

on:
  workflow_dispatch:

  schedule:
    - cron: "7 9 * * *"
      timezone: "Asia/Kolkata"

jobs:

  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------
      # IPO ALERT
      # --------------------------------------------------

      - name: Run IPO Alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python ipo_alert.py


      # --------------------------------------------------
      # STOCK SCANNER
      # --------------------------------------------------

      - name: Run High Conviction Stock Scanner
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python stock_alert.py
